<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loader Store - نظام الإدارة</title>
<link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--y:#F4B000;--sand:#E6C27A;--ink:#2C2C2C;--bg:#F5F5F5;--card:#fff;--tx:#2C2C2C;--mu:#777;--bd:#e8e2d4;--red:#d93a3a;--grn:#2e9d57;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--card:#2a2a2a;--tx:#f2f2f2;--mu:#aaa;--bd:#3d3a32}}
:root[data-theme="dark"]{--bg:#1b1b1b;--card:#2a2a2a;--tx:#f2f2f2;--mu:#aaa;--bd:#3d3a32}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:230px;background:#2C2C2C;color:#eee;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:.2s}
.logo{text-align:center;color:var(--y);font-weight:800;font-size:22px;letter-spacing:1px;margin-bottom:18px}.logo small{display:block;color:#ccc;font-weight:400;font-size:12px}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#ddd;font:inherit;font-size:15px;padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;text-align:right}
nav button:hover{background:#3a3a3a}nav button.on{background:var(--y);color:#2C2C2C;font-weight:700}
main{flex:1;min-width:0;padding:14px 18px 30px}
header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
header input{flex:1;max-width:520px}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--y)}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--tx);font:inherit}
.menu{display:none}
.hero{border-radius:12px;background:linear-gradient(100deg,#232323 40%,#8a5a1c 100%);color:#fff;padding:28px 30px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.hero h1{margin:0;color:var(--y);font-size:34px;direction:ltr;text-align:left}.hero .en{direction:ltr;text-align:left;font-size:18px}
.hero p{margin:12px 0 0;color:var(--sand);font-size:17px;line-height:1.7;border-top:3px solid var(--y);padding-top:10px}
.hero svg{width:210px;max-width:40%;flex-shrink:0}
.grid{display:grid;gap:12px}.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.two{grid-template-columns:1fr 1.2fr 1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:0}
.kpi .ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:#fff;margin-bottom:8px}
.kpi b{font-size:24px;display:block}.kpi small{color:var(--mu);font-size:12px}.up{color:var(--grn)}.dn{color:var(--red)}
h2{font-size:17px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--bg);text-align:right;padding:9px 10px;color:var(--mu);font-weight:500;white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.btn{background:var(--y);color:#2C2C2C;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.95)}
.btn.g{background:#777;color:#fff}.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.bd.r{background:#fde4e4;color:var(--red)}.bd.o{background:#e1f5e8;color:var(--grn)}
.lk{background:none;border:0;color:var(--y);cursor:pointer;font:inherit;font-weight:700}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9;padding:16px}.modal.on{display:grid}
.modal form{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:440px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.modal label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#2C2C2C;color:#fff;padding:10px 20px;border-radius:30px;border:2px solid var(--y);display:none;z-index:10}
.tot{display:grid;gap:6px;max-width:300px;margin-inline-start:auto;margin-top:12px}.tot div{display:flex;justify-content:space-between}.tot .f{font-size:19px;font-weight:800;border-top:2px solid var(--y);padding-top:6px}
.empty{text-align:center;color:var(--mu);padding:26px}
@media(max-width:900px){.two{grid-template-columns:1fr}aside{position:fixed;right:0;z-index:8;transform:translateX(100%)}aside.on{transform:none}.menu{display:inline-block}.hero svg{display:none}}
@media print{aside,header,.noprint{display:none!important}}
#auth{position:fixed;inset:0;z-index:20;display:flex;background:var(--bg)}#auth.off{display:none}
.ap{flex:1;background:linear-gradient(150deg,#232323 45%,#8a5a1c);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center}.ap svg{width:240px;margin-bottom:10px}.ap .logo{font-size:34px}.ap p{color:var(--sand);font-size:18px;line-height:1.8;margin-top:18px;border-top:3px solid var(--y);padding-top:12px}
.af{flex:1;display:grid;place-items:center;padding:20px;overflow:auto}.af form{width:100%;max-width:400px;display:grid;gap:12px}.af label{display:grid;gap:4px;font-size:13px;color:var(--mu);position:relative}.af input:not([type=checkbox]){width:100%}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px}.tabs button{flex:1;border:0;background:none;font:inherit;font-weight:700;padding:9px;border-radius:7px;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--y);color:#2C2C2C}
.eye{position:absolute;left:8px;bottom:6px;background:none;border:0;cursor:pointer;font-size:16px}
.ae{border-radius:8px;padding:9px 12px;font-size:13px;display:none}.ae.e{display:block;background:#fde4e4;color:var(--red)}.ae.s{display:block;background:#e1f5e8;color:var(--grn)}
.chk{display:flex!important;flex-direction:row;align-items:center;gap:8px}.hint{font-size:12px;color:var(--mu);text-align:center}
@media(max-width:800px){.ap{display:none}}
</style>
</head>
<body>
<aside id="side"><div class="logo"><img src="/logo.png" alt="" width="64" height="64" style="display:block;margin:0 auto 8px;border-radius:14px">LOADER STORE<small>Management System</small></div><nav id="nav"></nav></aside>
<main>
<header><button class="ib menu" id="mb" aria-label="القائمة">☰</button><input id="gs" placeholder="ابحث عن منتج، عميل، فاتورة..."><button class="ib" id="th" title="الوضع الليلي">🌓</button><button class="ib" id="bl" title="الإشعارات" onclick="bell()">🔔<span class="bd r" id="bc" style="margin-inline-start:4px">0</span></button><span style="position:relative"><button class="ib" id="um" aria-haspopup="true">👤 <span id="un">مدير النظام</span> ▾</button><div id="dd" class="card noprint" style="display:none;position:absolute;left:0;top:44px;width:170px;z-index:7;padding:6px"><button class="lk" style="display:block;width:100%;text-align:right;padding:8px" onclick="prof()">الملف الشخصي</button><button class="lk" style="display:block;width:100%;text-align:right;padding:8px;color:var(--red)" onclick="out()">تسجيل الخروج</button></div></span></header>
<div id="app"></div>
</main>
<div id="auth"><div class="ap"><svg viewBox="0 0 220 120"><path d="M0 110 L70 30 L110 80 L150 20 L220 110Z" fill="#F4B000" opacity=".25"/><rect x="40" y="58" width="70" height="30" rx="4" fill="#F4B000"/><rect x="52" y="40" width="34" height="22" rx="3" fill="#F4B000"/><path d="M110 72 L165 70 L178 96 L120 98Z" fill="#c98d00"/><circle cx="58" cy="94" r="15" fill="#222" stroke="#F4B000" stroke-width="3"/><circle cx="104" cy="94" r="15" fill="#222" stroke="#F4B000" stroke-width="3"/></svg><div class="logo">LOADER STORE<small>Management System</small></div><p>إدارة متكاملة لقطع غيار اللودر<br>من المخزون حتى الأرباح</p></div><div class="af"><form id="aform" novalidate></form></div></div>
<div class="modal" id="md"><form id="mf"></form></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fm=n=>Number(n).toLocaleString('en')+' ج.م';
let P=[{code:'FL-1001',n:'فلتر زيت المحرك',c:'فلاتر',q:12,min:5,cost:300,price:450},{code:'HY-2002',n:'سلك هيدروليك',c:'هيدروليك',q:5,min:5,cost:220,price:320},{code:'TR-3003',n:'تيل فرامل',c:'فرامل',q:9,min:10,cost:520,price:680},{code:'AC-4004',n:'مبرد زيت',c:'تبريد',q:15,min:10,cost:180,price:250},{code:'HV-5005',n:'بلف هيدروليك',c:'هيدروليك',q:6,min:5,cost:620,price:750},{code:'BK-6006',n:'جلبة جاروف',c:'جاروف',q:20,min:5,cost:120,price:180}];
let S=[{name:'شركة التوريدات العامة',phone:'01012345678',addr:'القاهرة - مدينة نصر',note:'جودة عالية'},{name:'مؤسسة قطع الغيار',phone:'01098765432',addr:'الجيزة - حدائق الأهرام',note:'أسعار مناسبة'},{name:'شركة المعدات الثقيلة',phone:'01122334455',addr:'السويس',note:'مواعيد ممتازة'}];
let C=[{name:'شركة النيل',phone:'01111111111',bal:0},{name:'أحمد محمد',phone:'01222222222',bal:1500},{name:'مؤسسة الصحراء',phone:'01033333333',bal:0},{name:'علي خالد',phone:'01555555555',bal:800},{name:'محمود جمعة',phone:'01066666666',bal:0}];
let I=[['SI-0012','شركة النيل','2026-10-12',8750],['SI-0011','أحمد محمد','2026-10-12',12300],['SI-0010','مؤسسة الصحراء','2026-10-11',6950],['SI-0009','علي خالد','2026-10-11',18500],['SI-0008','محمود جمعة','2026-10-10',9200]].map(a=>({no:a[0],cust:a[1],date:a[2],total:a[3]}));
let PU=[{no:'PO-101',sup:'شركة التوريدات العامة',date:'2026-10-09',total:21000,st:'تم الاستلام'},{no:'PO-102',sup:'مؤسسة قطع الغيار',date:'2026-10-11',total:9600,st:'قيد الشحن'}];
let PY=[{no:'PY-31',party:'شركة النيل',type:'قبض',amt:5000,date:'2026-10-12'},{no:'PY-32',party:'مؤسسة قطع الغيار',type:'دفع',amt:4000,date:'2026-10-11'}];
let EX=[{item:'إيجار المحل',cat:'ثابتة',amt:6000,date:'2026-10-01'},{item:'كهرباء',cat:'ثابتة',amt:850,date:'2026-10-05'},{item:'نقل بضاعة',cat:'متغيرة',amt:400,date:'2026-10-10'}];
const D={inv:{t:'المخزون',add:'إضافة صنف',d:P,cols:[['code','الكود'],['n','الصنف'],['c','التصنيف'],['q','الكمية'],['min','الحد الأدنى'],['cost','التكلفة'],['price','سعر البيع']],s:1},
sup:{t:'الموردين',add:'إضافة مورد',d:S,cols:[['name','اسم المورد'],['phone','الهاتف'],['addr','العنوان'],['note','ملاحظات']],s:1},
cus:{t:'العملاء',add:'إضافة عميل',d:C,cols:[['name','الاسم'],['phone','الهاتف'],['bal','الرصيد المستحق']],s:1},
pur:{t:'المشتريات',add:'فاتورة شراء',d:PU,cols:[['no','الرقم'],['sup','المورد'],['date','التاريخ'],['total','الإجمالي'],['st','الحالة']]},
pay:{t:'المدفوعات',add:'حركة جديدة',d:PY,cols:[['no','الرقم'],['party','الطرف'],['type','النوع'],['amt','المبلغ'],['date','التاريخ']]},
exp:{t:'المصروفات',add:'إضافة مصروف',d:EX,cols:[['item','البند'],['cat','النوع'],['amt','المبلغ'],['date','التاريخ']]}};
const N=[['home','الرئيسية','🏠'],['inv','المخزون','📦'],['sale','المبيعات','🛒'],['pur','المشتريات','🧾'],['cus','العملاء','👥'],['sup','الموردين','🚚'],['pay','المدفوعات','💳'],['exp','المصروفات','💸'],['zk','الزكاة','🕌'],['rep','التقارير','📊'],['set','الإعدادات','⚙️']];
let cur='home',q='',cat='',ed=-1,inv={cust:C[0].name,items:[],disc:0};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)};
const go=p=>{if(!can(p))return toast('ليس لديك صلاحية لهذه الصفحة');cur=p;q='';cat='';$('#side').classList.remove('on');draw()};
function nav(){const pn=U.filter(u=>u.st=='pending').length,bc=$('#bc');bc.textContent=pn;bc.style.display=pn?'':'none';$('#nav').innerHTML=N.filter(n=>can(n[0])).map(n=>`<button class="${n[0]==cur?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join('')}
function draw(){nav();$('#app').innerHTML=({home,sale,zk,rep,set}[cur]||crud)();window.scrollTo(0,0)}
function loader(){return`<svg viewBox="0 0 220 120"><path d="M0 110 L70 30 L110 80 L150 20 L220 110Z" fill="#F4B000" opacity=".25"/><rect x="40" y="58" width="70" height="30" rx="4" fill="#F4B000"/><rect x="52" y="40" width="34" height="22" rx="3" fill="#F4B000"/><path d="M110 72 L165 70 L178 96 L120 98Z" fill="#c98d00"/><circle cx="58" cy="94" r="15" fill="#222" stroke="#F4B000" stroke-width="3"/><circle cx="104" cy="94" r="15" fill="#222" stroke="#F4B000" stroke-width="3"/></svg>`}
function home(){const sales=I.reduce((a,b)=>a+b.total,0),val=P.reduce((a,p)=>a+p.q*p.cost,0),low=P.filter(p=>p.q<=p.min),days=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],v=[8,12,19,16,17,25,22].map(x=>x*1000);
const k=[['#2e9d57','💰','إجمالي المبيعات',fm(sales),'+12%'],['#2f7fd6','📦','قيمة المخزون',fm(val),'+8%'],['#d93a3a','⚠️','أصناف ناقصة',low.length,'-3',1],['#7b57d1','👥','العملاء',C.length,'+2'],['#1f9aa6','🧾','فواتير اليوم',I.filter(i=>i.date=='2026-10-12').length,'+2'],['#f09a1a','📈','الأرباح',fm(Math.round(sales*.26)),'+15%']];
const mx=30000,pts=v.map((y,i)=>[20+i*(360/6),130-y/mx*110]);
return`<div class="hero"><div><h1>Loader Store</h1><div class="en">Management System</div><p>إدارة متكاملة لقطع غيار اللودر<br>من المخزون حتى الأرباح</p></div>${loader()}</div>
<div class="grid k6">${k.map(x=>`<div class="card kpi"><div class="ic" style="background:${x[0]}">${x[1]}</div><small>${x[2]}</small><b>${x[3]}</b><small class="${x[5]?'dn':'up'}">${x[5]?'▼':'▲'} ${x[4]} مقارنة بالشهر الماضي</small></div>`).join('')}</div>
<div class="grid two"><div class="card"><h2>المبيعات (آخر 7 أيام)</h2><svg viewBox="0 0 400 160" style="width:100%"><polyline points="${pts.map(p=>p.join(',')).join(' ')} 380,130 20,130" fill="#F4B00033"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#F4B000" stroke-width="3"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#F4B000"><title>${days[i]}: ${fm(v[i])}</title></circle><text x="${p[0]}" y="150" font-size="10" text-anchor="middle" fill="#888">${days[i]}</text>`).join('')}</svg></div>
<div class="card"><div class="row"><h2>أحدث الفواتير</h2><button class="lk" onclick="go('sale')">عرض الكل</button></div><div class="tw"><table><tr><th>الفاتورة</th><th>العميل</th><th>المبلغ</th></tr>${I.slice(0,5).map(i=>`<tr><td>${i.no}</td><td>${i.cust}</td><td>${i.total.toLocaleString('en')}</td></tr>`).join('')}</table></div></div>
<div class="card"><div class="row"><h2>أصناف أقل من الحد الأدنى</h2><button class="lk" onclick="go('inv')">عرض الكل</button></div><div class="tw"><table><tr><th>الصنف</th><th>الكمية</th><th>الحد</th></tr>${low.map(p=>`<tr><td>${p.n}</td><td><span class="bd r">${p.q}</span></td><td>${p.min}</td></tr>`).join('')||'<tr><td colspan=3 class="empty">كل الأصناف متوفرة</td></tr>'}</table></div></div></div>`}
function crud(){const c=D[cur];let r=c.d.map((x,i)=>[x,i]);if(q)r=r.filter(([x])=>JSON.stringify(x).includes(q));if(cat)r=r.filter(([x])=>x.c==cat);
const cats=cur=='inv'?[...new Set(P.map(p=>p.c))]:[];
return`<div class="row"><h2 style="font-size:22px">${c.t}</h2><span>${cur=='inv'?'<button class="btn g" onclick="imgSearch()">📷 بحث بالصورة</button> ':''}<button class="btn" onclick="openM(-1)">+ ${c.add}</button></span></div>
<div class="card"><div class="row noprint">${c.s?`<input placeholder="بحث..." value="${q}" oninput="q=this.value;keep()" id="sq" style="flex:1">`:''}${cats.length?`<select onchange="cat=this.value;draw()"><option value="">كل التصنيفات</option>${cats.map(x=>`<option ${x==cat?'selected':''}>${x}</option>`).join('')}</select>`:''}</div>
<div class="tw"><table><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${r.map(([x,i])=>`<tr>${c.cols.map(k=>{let v=x[k[0]];if(k[0]=='q')return`<td><span class="bd ${x.q<=x.min?'r':'o'}">${v}</span></td>`;if(['cost','price','bal','amt','total'].includes(k[0]))v=fm(v);return`<td>${v}</td>`}).join('')}<td>${cur=='inv'&&me&&me.role=='مدير'?`<button class="lk" onclick="refPhoto(${i})" title="صورة مرجعية">${IMGS.some(r=>r.product_id==x.id)?'📷✓':'📷'}</button> `:''}<button class="lk" onclick="openM(${i})">تعديل</button> <button class="lk" style="color:var(--red)" onclick="del(${i})">حذف</button></td></tr>`).join('')||`<tr><td colspan=9 class="empty">لا توجد نتائج. جرّب بحثًا آخر أو أضف عنصرًا جديدًا.</td></tr>`}</table></div></div>`}
function keep(){const p=$('#sq').selectionStart;draw();const e=$('#sq');e.focus();e.setSelectionRange(p,p)}
function openM(i){ed=i;const c=D[cur],x=i<0?{}:c.d[i];$('#mf').innerHTML=`<h2>${i<0?c.add:'تعديل'}</h2>${c.cols.map(k=>`<label>${k[1]}<input name="${k[0]}" value="${x[k[0]]??''}" ${typeof c.d[0]?.[k[0]]=='number'?'type="number" step="any"':''} required></label>`).join('')}<div class="row"><button class="btn">حفظ</button><button type="button" class="btn g" onclick="$('#md').classList.remove('on')">إلغاء</button></div>`;$('#md').classList.add('on')}
$('#mf').onsubmit=async e=>{e.preventDefault();const c=D[cur],o={};c.cols.forEach(k=>{const v=e.target[k[0]].value;o[k[0]]=typeof c.d[0]?.[k[0]]=='number'?+v:v});try{ed<0?await api('POST','/'+EN[cur],o):await api('PUT','/'+EN[cur]+'/'+c.d[ed].id,o);await loadAll();$('#md').classList.remove('on');draw();toast('تم الحفظ')}catch(er){toast(er.message)}};
async function del(i){if(confirm('هل تريد حذف هذا العنصر؟')){try{await api('DELETE','/'+EN[cur]+'/'+D[cur].d[i].id);await loadAll();draw();toast('تم الحذف')}catch(er){toast(er.message)}}}

const cats=[...new Set(P.map(p=>p.c))],ct=cats.find(c=>tk.some(w=>sim(strip(w),strip(AR(c)))>.8));
if(ct&&has('ايه','اصناف','انواع','كل','عندنا','عندك','قطع','اعرض')){const l=P.filter(p=>p.c==ct);return 'أصناف «'+ct+'»:\n'+l.map(p=>'• '+p.n+' — '+fm(p.price)+' — المتاح '+p.q).join('\n')}
const pm=pmOf(qt);if(pm){if(pm.alt)return'تقصد «'+pm.o.n+'» ولا «'+pm.alt.n+'»؟';const p=pm.o,st=p.q<=p.min?'⚠️ تحت الحد الأدنى':'متوفر ✓';
if(has('هامش','ربح'))return mgr?p.n+': التكلفة '+fm(p.cost)+' والبيع '+fm(p.price)+' ← هامش '+Math.round((p.price-p.cost)/p.price*100)+'%':MG;
if(has('سعر','اسعار','بكام','تمن','ثمن'))return p.n+': سعر البيع '+fm(p.price)+(mgr?' (التكلفة '+fm(p.cost)+')':'');
return p.n+': المتاح '+p.q+' (الحد الأدنى '+p.min+') — '+st+' — السعر '+fm(p.price)+note}

return REFUSE}
